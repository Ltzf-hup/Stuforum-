<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息 - StuForum</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/m-n.css">
</head>

<body class="forum-body">
  <div id="app">
    <div id="header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span>StuForum</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="explore.html" class="nav-link">探索</a>
        <a href="m-n.html" class="nav-link">消息</a>
        <a href="profile.html" class="nav-link">个人资料</a>
      </div>
      <!-- 汉堡菜单按钮 -->
      <button class="menu-toggle" id="menuToggle">
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
        <span class="menu-icon"></span>
      </button>
    </div>

    <div class="weibo-message-container">
      <!-- 左侧边栏 - 消息类型 -->
      <div class="message-type-sidebar">
        <div class="message-type-item active">
          <span class="message-type-icon">💬</span>
          <span>私信</span>
        </div>
        <!-- <div class="message-type-item">
          <span class="message-type-icon">🔔</span>
          <span>通知</span>
        </div> -->
      </div>

      <!-- 中间边栏 - 会话列表 -->
      <div class="conversation-sidebar">

        <div class="sidebar-header">私信</div>
        <div class="weibo-conversation-list"><!-- 列表开始 -->
          <!-- 加载状态 -->
          <div v-if="loadingList" class="loading-state">
            <div class="loading-spinner"></div>
            <div>加载中...</div>
          </div>

          <!-- 会话列表为空时显示 -->
          <div v-else-if="conversationList.length === 0" class="empty-state">
            <div class="empty-icon">👥</div>
            <div>暂无会话</div>
          </div>

          <!-- 会话列表 -->
          <div v-else class=" weibo-conversation-item" v-for="item in conversationList" :key="item.id"
            :class="{ 'active': activeConversation === item.uname }" @click="selectConversation(item.uname,item.id)">
            <div class="conversation-avatar">
              <div class="avatar">
                <template
                  v-if="item.avatarUrl && (item.avatarUrl.startsWith('http') || item.avatarUrl.startsWith('/'))">
                  {{ item.uname.charAt(0).toUpperCase() }}
                </template>
                <template v-else>
                  <img :src="item.avatarUrl" alt="用户头像" style="width: 100%; height: 100%; border-radius: 50%;">
                </template>
              </div>
            </div>

            <div class="conversation-info">
              <div class="conversation-header">
                <div class="conversation-name">{{ item.uname }}</div>
                <div class="conversation-time">{{ item.lastMessageTime }}</div>
              </div>
              <div class="conversation-last-message">
                {{ item.lastMessage || '暂无消息' }}
              </div>
            </div>
          </div>
        </div><!-- 列表结束 -->

      </div>

      <!-- 主内容区 - 消息详情 -->
      <div class="message-detail">
        <div class="message-detail-header">
          <div class="detail-info">
            <div class="detail-name">{{ activeConversation }}</div>
            <!-- <div class="detail-status">在线</div> -->
          </div>
        </div>

        <div class="message-content" ref="messageContainer">
          <!-- 动态显示当前选中会话的消息 -->
          <div v-for="message in messages" :key="message.id"
            v-if="activeConversation && message.conversationId === activeConversation">
            <!-- 对方的消息（显示在左边） -->
            <div v-if="!message.isSelf" class="message-bubble other">
              <div class="avatar">
                <template
                  v-if="message.avatar && (message.avatar.startsWith('http') || message.avatar.startsWith('/'))">
                  {{ message.avatar }}
                </template>
                <template v-else>
                  <img :src="message.avatar" alt="用户头像" style="width: 100%; height: 100%; border-radius: 50%;">
                </template>
              </div>
              <div class="bubble-content">
                {{ message.content }}
                <span class="bubble-time">{{ message.time }}</span>
              </div>
            </div>

            <!-- 自己的消息（显示在右边） -->
            <div v-else class="message-bubble user">
              <div class="bubble-content">
                {{ message.content }}
                <span class="bubble-time">{{ message.time }}</span>
              </div>
              <div class="avatar">
                <template
                  v-if="message.avatar && (message.avatar.startsWith('http') || message.avatar.startsWith('/'))">
                  {{ message.avatar }}
                </template>
                <template v-else>
                  <img :src="message.avatar" alt="用户头像" style="width: 100%; height: 100%; border-radius: 50%;">
                </template>
              </div>
            </div>
          </div>

          <!-- 当没有选中会话或会话中没有消息时显示的提示 -->
          <div v-if="!activeConversation" class="no-conversation-tip">请选择一个会话开始聊天</div>
          <div v-else-if="messages.filter(m => m.conversationId === activeConversation).length === 0"
            class="no-message-tip">暂无消息，开始发送第一条消息吧</div>
        </div>

        <div class="weibo-message-input-area">
          <div class="input-container">
            <textarea class="weibo-input" id="message-input" v-model="inputMessage" @keyup.enter="sendMessage"
              placeholder="输入消息..."></textarea>
            <button class="send-btn" id="sendbtn" @click="sendMessage">
              <span>➤</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/vue.js"></script>
  <script src="js/config.js"></script>
  <script src="js/m-n.js"></script>
  <script>
    // 汉堡菜单交互
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.querySelector('.nav-links');

    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('expanded');
      });

      // 点击导航链接后关闭菜单
      const navItems = navLinks.querySelectorAll('.nav-link');
      navItems.forEach(item => {
        item.addEventListener('click', () => {
          menuToggle.classList.remove('active');
          navLinks.classList.remove('expanded');
        });
      });
    }
  </script>
</body>

</html>
