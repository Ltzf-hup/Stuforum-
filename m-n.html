<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息 - StuForum</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/m-n.css">
</head>

< class="forum-body">
  <div id="app">
    <div id="header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span>StuForum</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="explore.html" class="nav-link">探索</a>
        <a href="m-n.html" class="nav-link">消息</a>
        <a href="profile.html" class="nav-link">个人资料</a>
      </div>
    </div>

    <div class="weibo-message-container">
      <!-- 左侧边栏 - 消息类型 -->
      <div class="message-type-sidebar">
        <div class="message-type-item active">
          <span class="message-type-icon">💬</span>
          <span>私信</span>
        </div>
        <div class="message-type-item">
          <span class="message-type-icon">🔔</span>
          <span>通知</span>
        </div>
        <div class="message-type-item">
          <span class="message-type-icon">💌</span>
          <span>评论</span>
        </div>
      </div>

      <!-- 中间边栏 - 会话列表 -->
      <div class="conversation-sidebar">

        <div class="sidebar-header">私信</div>
        <div class="weibo-conversation-list"><!-- 列表开始 -->

          <div class=" weibo-conversation-item" :class="{ 'active': activeConversation === '张三' }"
            @click="selectConversation('张三')">
            <!-- <div class="conversation-avatar">
              <div class="avatar">张</div>
            </div> -->

            <div class="conversation-info">
              <div class="conversation-header">
                <div class="conversation-name">张三</div>
                <div class="conversation-time"></div>
              </div>
              <div class="conversation-last-message">这里用来显示最新信息</div>
            </div>
          </div>

        </div><!-- 列表结束 -->

      </div>

      <!-- 主内容区 - 消息详情 -->
      <div class="message-detail">
        <div class="message-detail-header">
          <div class="detail-info">
            <div class="detail-name">张三</div>
            <!-- <div class="detail-status">在线</div> -->
          </div>
        </div>

        <div class="message-content">
          <!-- 张三的对话 -->
          <template v-if="activeConversation ==='张三'">
            <div v-for="message in messages" :key="message.id">
              <!-- 对方的消息（显示在左边） -->
              <div v-if="!message.isSelf" class="message-bubble other">
                <div class="avatar">{{ message.avatar }}</div>
                <div class="bubble-content">
                  {{ message.content }}
                  <span class="bubble-time">{{ message.time }}</span>
                </div>
              </div>

              <!-- 自己的消息（显示在右边） -->
              <div v-else class="message-bubble user">
                <div class="bubble-content">
                  {{ message.content }}
                  <span class="bubble-time">{{ message.time }}</span>
                </div>
                <div class="avatar">{{ message.avatar }}</div>
              </div>
            </div>
          </template>

        </div>

        <div class="weibo-message-input-area">
          <div class="input-container">
            <textarea class="weibo-input" id="message-input" v-model="inputMessage" @keyup.enter="sendMessage"
              placeholder="输入消息..."></textarea>
            <button class="send-btn" id="sendbtn" @click="sendMessage">
              <span>➤</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/vue.js"></script>
  <!-- <script src="js/config.js"></script> -->
  <script src="js/m-n.js"></script>
  </body>

</html>
