<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet" />
  <style>
    #editor—wrapper {
      border: 1px solid #ccc;
      z-index: 100;
      /* 按需定义 */
    }

    #toolbar-container {
      border-bottom: 1px solid #ccc;
    }

    #editor-container {
      /* height: 200px; */
      flex: 1;
      border: 2px solid #e9ecef;
      resize: none;
      outline: none;
      font-size: 1.25rem;
      padding: 1rem;
      min-height: 100px;
      line-height: 1.5;
      border-radius: 12px;
      background-color: white;
      transition: all 0.3s ease;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #editor-container img {
      max-width: 200px;
      height: 200px;
    }
  </style>
</head>

<body>
  <div id="editor—wrapper">

    <!-- 编辑器 -->
    <div id="editor-container"></div>
    <!-- 工具栏 -->
    <div id="toolbar-container"></div>
  </div>
  <textarea id="ww"></textarea>
  <script src="lib/jquery-1.12.4.js"></script>
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/@wangeditor/editor@latest/dist/index.js"></script>
  <script>
    //生命周期

    const { createEditor, createToolbar } = window.wangEditor

    const editorConfig = {
      //相当于文本框中的 placeholder
      placeholder: '分享你的想法...',
      //设置为只读模式
      readOnly: false,
      // 如果有需求，只读状态可通过 editor.enable() 和 editor.disable() 切换
      // 自动获取焦点,进入网页的时候自动获取焦点
      autoFocus: true,
      //scroll 滚动条，默认是true
      scroll: true,

      onChange(editor) {
        const html = editor.getHtml()
        console.log('editor content', html)
        // 也可以同步到 <textarea>
        document.getElementById('ww').value = html
      },
    }

    const editor = createEditor({
      selector: '#editor-container',
      html: '<p><br></p>',
      config: editorConfig,
      mode: 'default', // or 'simple'
    })

    const toolbarConfig = {
    }
    //查询工具栏的所有key值
    console.log(editor.getAllMenuKeys())
    toolbarConfig.toolbarKeys = [
      // 菜单 key
      // 'headerSelect',

      // 分割线
      // '|',

      // 菜单 key
      // 'bold',
      // 'italic',
      'insertImage',
      'uploadImage'
      // 菜单组，包含多个菜单
      // {
      //   key: 'group-more-style', // 必填，要以 group 开头
      //   title: '更多样式', // 必填
      //   iconSvg: '<svg>....</svg>', // 可选
      //   menuKeys: ['through', 'code', 'clearStyle'], // 下级菜单 key ，必填
      // },
      // 继续配置其他菜单...
    ]
    toolbarConfig.modalAppendToBody = true

    // 创建 toolbar 和 editor

    // 可监听 `modalOrPanelShow` 和 `modalOrPanelHide` 自定义事件来设置样式、蒙层
    editor.on('modalOrPanelShow', modalOrPanel => {
      if (modalOrPanel.type !== 'modal') return
      const { $elem } = modalOrPanel // modal element

      // 设置 modal 样式（定位、z-index）,居中显示
      $elem.css({
        position: 'absolute',
        top: '50%',
        left: '50%',
        transform: 'translate(-50%, -50%)',
        zIndex: 1000,
      })
      // 显示蒙层
    })
    editor.on('modalOrPanelHide', () => {
      // 隐藏蒙层
    })
    const toolbar = createToolbar({
      editor,
      selector: '#toolbar-container',
      config: toolbarConfig,
      mode: 'default', // or 'simple'
    })
    console.log(toolbar.getConfig().toolbarKeys)
    // 编辑器创建完成后
    editor.on('created', editor => {
      console.log('编辑器创建完成后')
    })
    // 编辑器内容变化时
    editor.on('change', editor => {
      console.log('编辑器内容变化时')
    })
    // 编辑器销毁时
    editor.on('destroy', editor => {
      console.log('编辑器销毁时')
    })
  </script>
</body>

</html>
