<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探索 - StuForum</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div id="app">
    <div id="header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span>StuForum</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="explore.html" class="nav-link">探索</a>
        <a href="m-n.html" class="nav-link">消息/通知</a>
        <a href="profile.html" class="nav-link">个人资料</a>
      </div>
    </div>

    <div id="body">
      <div id="left-body">
        <span>热门话题</span>
        <div class="trending-item">
          <div class="trend-category">编程</div>
          <div class="trend-name">#Python学习</div>
          <div class="trend-count">12.3k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">学习</div>
          <div class="trend-name">#期末复习</div>
          <div class="trend-count">8.9k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">校园生活</div>
          <div class="trend-name">#校园活动</div>
          <div class="trend-count">5.6k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">就业</div>
          <div class="trend-name">#实习经验</div>
          <div class="trend-count">3.4k讨论</div>
        </div>
      </div>

      <div id="middle-body">

        <div style="padding: 1rem; border-bottom: 1px solid #e9ecef;">
          <div style="position: relative; width: 100%;">
            <input type="text" v-model="searchQuery" placeholder="搜索话题、用户或内容..." style="width: 100%; padding: 0.75rem 2.5rem 0.75rem 0.75rem; 
            border: 1px solid #e9ecef; border-radius: 25px; background-color: #f8f9fa; font-size: 1rem;">
            <span @click="performSearch" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); 
              cursor: pointer; color: #adb5bd; font-size: 1.2rem;">
              <img src="image/pin/4.png" alt="搜索" style="width: 24px; height: 24px;">
            </span>
          </div>
        </div>

        <div class="posts-container" v-for="item in list">
          <div class="post">
            <div class="post-avatar">
              <div class="avatar" style="background-color: #794bc4;">L</div>
            </div>
            <div class="post-content">
              <div class="post-header-info">
                <span class="post-user">{{item.uname}}</span>
                <span class="post-handle">@{{item.uname}}</span>
                <span class="post-time">{{item.postedTime}}</span>
              </div>
              <div class="post-text">
                {{item.txt}}
              </div>
              <div class="post-actions-bar">
                <div class="post-action">
                  <span>💬</span>
                  <span class="action-count">{{item.replyCount}}</span>
                </div>
                <div class="post-action">
                  <span>🔄</span>
                  <span class="action-count">{{item.viewCount}}</span>
                </div>
                <div class="post-action">
                  <span>❤️</span>
                  <span class="action-count">{{item.likeCount}}</span>
                </div>
                <div class="post-action">
                  <span>📤</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="right-body">
        <span>推荐关注</span>
        <div class="user-item">
          <div class="user-info">
            <div class="avatar" style="background-color: #ff758f;">S</div>
            <div class="user-details">
              <div class="user-name">Sarah Liu</div>
              <div class="user-handle">@sarahliu</div>
            </div>
          </div>
          <button class="follow-btn">关注</button>
        </div>
        <div class="user-item">
          <div class="user-info">
            <div class="avatar" style="background-color: #38b000;">D</div>
            <div class="user-details">
              <div class="user-name">David Park</div>
              <div class="user-handle">@davidp</div>
            </div>
          </div>
          <button class="follow-btn">关注</button>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/jquery-1.12.4.js"></script>
  <script src="lib/vue.js"></script>
  <script src="js/explore.js"></script>
</body>

</html>
