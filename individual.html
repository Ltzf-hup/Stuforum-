<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - StuForum</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/individual.css">
</head>

<body class="forum-body">
    <div id="app">
        <div id="header">
        </div>

        <div class="box">
            <div class="left">
                <div class="left-top">
                    <!-- 背景封面区域 -->
                </div>
                <div class="left-middle">
                    <div class="tx">
                        <img :src="avatarUrl" alt="">
                    </div>

                    <div class="action-buttons" v-if="isSelf">
                        <button class="btn btn-primary follow-btn" @click="followUser">关注</button>
                        <button class="btn btn-secondary" @click="sendMessage" id="messageBtn"
                            style="display: none;">私信</button>
                    </div>
                    <div class="action-buttons" v-else>
                    </div>
                    <div class="user-info">
                        <div class="user-name">{{uname}}</div>
                        <div class="user-handle">@{{uname}}</div>
                    </div>

                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-number">{{gzNum}}</div>
                            <div class="stat-label">关注</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">{{fansNum}}</div>
                            <div class="stat-label">粉丝</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">{{numOfPosts}}</div>
                            <div class="stat-label">帖子</div>
                        </div>
                        <!-- <div class="stat-item">
                            <div class="stat-number">234</div>
                            <div class="stat-label">获赞</div>
                        </div> -->
                    </div>

                    <!-- 添加关注和私信按钮 -->
                    <img src="downlaod?img=a.jgp" alt="">
                </div>
            </div>

            <div class="right">
                <div class="right-top">
                    <div class="tab active" @click="switchTab('posts')">帖子</div>
                    <div class="tab" @click="switchTab('replies')">回复</div>
                </div>

                <div class="right-content">
                    <div id="posts" class="content-section active">
                        <div class="post" v-for="item in list">
                            <div class=" post-header-info">
                                <span class="post-user">{{item.uname}}</span>
                                <span class="post-handle">@{{item.uname}} ·</span>
                                <span class="post-time">{{formatTime(item.postedTime)}}</span>
                            </div>
                            <div class="post-text">
                                {{item.txt}}
                            </div>
                            <div class="post-actions-bar">
                                <div class="post-action">
                                    <span>💬</span>
                                    <span class="action-count">12</span>
                                </div>
                                <div class="post-action">
                                    <span>🔄</span>
                                    <span class="action-count">8</span>
                                </div>
                                <div class="post-action">
                                    <span>❤️</span>
                                    <span class="action-count">56</span>
                                </div>
                                <div class="post-action">
                                    <span>📤</span>
                                </div>
                            </div>
                        </div>

                    </div>


                    <div id="replies" class="content-section">
                        <div class="post">
                            <div class="post-header-info">
                                <span class="post-user">User123</span>
                                <span class="post-handle">@user123 ·</span>
                                <span class="post-time">5天前</span>
                            </div>
                            <div class="post-text">
                                回复 Sarah Liu：非常感谢你的分享，对我很有帮助！
                            </div>
                            <div class="post-actions-bar">
                                <div class="post-action">
                                    <span>💬</span>
                                    <span class="action-count">3</span>
                                </div>
                                <div class="post-action">
                                    <span>❤️</span>
                                    <span class="action-count">12</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="media" class="content-section">
                        <div style="text-align: center; padding: 2rem; color: #6c757d;">
                            暂无媒体内容
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="lib/vue.js"></script>
    <script src="https://unpkg.com/@wangeditor/editor@latest/dist/index.js"></script>
    <script src="js/individual.js"></script>
</body>

</html>
