<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - StuForum</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
  <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet" />

</head>

<body>
  <div id="app">
    <div id="header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span>StuForum</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="explore.html" class="nav-link">探索</a>
        <a href="m-n.html" class="nav-link">消息</a>
        <a href="profile.html" class="nav-link">个人资料</a>
      </div>
    </div>

    <div id="body">

      <div id="middle-body">
        <div id="middle-body-text">
          <div class="post-header">
            <div class="avatar" :style="currentUserAvatarStyle">你</div>
            <textarea id="editor-container" class="post-input" placeholder="分享你的想法..."
              @keyup.enter="publishPost"></textarea>
          </div>
          <div class="post-actions">
            <div class="action-icons">
              <a class="action-icon"></a>
            </div>
            <button class="post-submit" @click="publishPost">发布</button>
          </div>
        </div>

        <div class="posts-container">
          <!-- 加载状态 -->
          <div v-if="isChecking" class="loading">
            <div class="loading-spinner"></div>
            <div>加载中...</div>
          </div>

          <!-- 帖子列表 -->
          <div class="post" v-for="lists in list">
            <div class="post-avatar">
              <a :href="'individual.html?uname=' + encodeURIComponent(lists.uname)+'&uid='+lists.uid"
                :key="lists.uname">
                <div class="avatar" :style="getAvatarColorStyle(lists.user?.username || lists.uname)">
                  <!-- 如果有头像数据，显示图片 -->
                  <img v-if="lists.avatarUrl" :src="lists.avatarUrl"
                    style="width: 100%; height: 100%; object-fit: cover;">

                  <!-- 如果没有头像，显示首字母 -->
                  <div v-else>
                    {{ getAvatarInitial(lists.user?.username || lists.uname) }}
                  </div>
                </div>
              </a>
            </div>
            <div class="post-content">
              <div class="post-header-info">
                <span class="post-user">{{ lists.uname }}</span>
                <span class="post-handle">@{{ lists.uname }} ·</span>
                <span class="post-time">{{ formatTime(lists.postedTime) }}</span>
              </div>
              <div class="post-text">
                {{ lists.txt }}
              </div>

              <!-- 帖子图片展示区 -->
              <div v-if="lists.imageUrl || (lists.images && lists.images.length > 0)" class="post-image-container">
                <img :src="lists.imageUrl || lists.images[0].imageUrl" alt="帖子图片" class="post-image"
                  @click="showImage(lists.imageUrl || lists.images[0].imageUrl)">
              </div>

              <div class="post-actions-bar">
                <div class="post-action">
                  <span>💬</span>
                  <span class="action-count">{{ lists.replyCount || 0 }}</span>
                </div>
                <div class="post-action" @click="toggleLike(lists)">
                  <span :class="{ 'liked': lists.isLiked }">❤️</span>
                  <span class="action-count">{{ lists.likeCount || 0 }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="lib/vue.js"></script>
  <script src="lib/jquery-1.12.4.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
