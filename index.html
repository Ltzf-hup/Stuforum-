<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - StuForum</title>
  <link rel="stylesheet" href="css/index.css">

</head>

<body>
  <div id="app">
    <div id="header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span>StuForum</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">首页</a>
        <a href="explore.html" class="nav-link">探索</a>
        <a href="m-n.html" class="nav-link">消息/通知</a>
        <a href="profile.html" class="nav-link">个人资料</a>
      </div>
    </div>

    <div id="body">
      <div id="left-body">
        <span>热门话题</span>
        <div class="trending-item">
          <div class="trend-category">编程</div>
          <div class="trend-name">#Python学习</div>
          <div class="trend-count">12.3k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">学习</div>
          <div class="trend-name">#期末复习</div>
          <div class="trend-count">8.9k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">校园生活</div>
          <div class="trend-name">#校园活动</div>
          <div class="trend-count">5.6k讨论</div>
        </div>
        <div class="trending-item">
          <div class="trend-category">就业</div>
          <div class="trend-name">#实习经验</div>
          <div class="trend-count">3.4k讨论</div>
        </div>
      </div>

      <div id="middle-body">
        <div id="middle-body-text">
          <div class="post-header">
            <div class="avatar" style="background-color: #2c7be5;">你</div>
            <textarea class="post-input" placeholder="分享你的想法..."></textarea>
          </div>
          <div class="post-actions">
            <div class="action-icons">
              <a class="action-icon"><img src="image/pin/1.png" alt="照片"></a>
              <span class="action-icon"><img src="image/pin/2.png" alt="视频"></span>
              <span class="action-icon"><img src="image/pin/3.png" alt="位置"></span>
            </div>
            <button class="post-submit">发布</button>
          </div>
        </div>

        <div class="posts-container">
          <div class="post" v-for=" lists in list">
            <div class="post-avatar">
              <div class="avatar" style="background-color: #10ac84;">M</div>
            </div>
            <div class="post-content">
              <div class="post-header-info">
                <span class="post-user">Mike Chen</span>
                <span class="post-handle">@mikec ·</span>
                <span class="post-time">5小时前</span>
              </div>
              <div class="post-text">
                {{lists.txt}}
              </div>
              <div class="post-actions-bar">
                <div class="post-action">
                  <span>💬</span>
                  <span class="action-count">28</span>
                </div>
                <div class="post-action">
                  <span>🔄</span>
                  <span class="action-count">12</span>
                </div>
                <div class="post-action">
                  <span>❤️</span>
                  <span class="action-count">36</span>
                </div>
                <div class="post-action">
                  <span>📤</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="right-body">
        <span>推荐关注</span>
        <div class="user-item">
          <div class="user-info">
            <div class="avatar" style="background-color: #ff758f;">S</div>
            <div class="user-details">
              <div class="user-name">Sarah Liu</div>
              <div class="user-handle">@sarahliu</div>
            </div>
          </div>
          <button class="follow-btn">关注</button>
        </div>
        <div class="user-item">
          <div class="user-info">
            <div class="avatar" style="background-color: #38b000;">D</div>
            <div class="user-details">
              <div class="user-name">David Park</div>
              <div class="user-handle">@davidp</div>
            </div>
          </div>
          <button class="follow-btn">关注</button>

        </div>
      </div>
    </div>
  </div>
  <script src="lib/vue.js"></script>
  <script src="lib/jquery-1.12.4.js"></script>
  <script src="js/index.js"></script>
</body>
    
</html>
